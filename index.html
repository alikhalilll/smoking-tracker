<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a18" />

    <!-- Primary -->
    <title>Smoke Tracker — taper, gap report &amp; quit plan</title>
    <meta name="description" content="A minimal PWA for tracking cigarettes, analysing gaps between every log, and following a personalized quit plan with daily targets and reminders." />
    <meta name="keywords" content="smoking tracker, quit smoking, cigarette log, taper plan, smoking gaps, PWA, habit tracker, stop smoking" />
    <meta name="author" content="Ali Khalil" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://alikhalilll.github.io/smoking-tracker/" />

    <!-- PWA / mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smoke Tracker" />
    <meta name="application-name" content="Smoke Tracker" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alikhalilll.github.io/smoking-tracker/" />
    <meta property="og:title" content="Smoke Tracker — taper, gap report &amp; quit plan" />
    <meta property="og:description" content="Track cigarettes, see gaps between every log, and follow a personalized quit plan with daily targets and reminders." />
    <meta property="og:site_name" content="Smoke Tracker" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta property="og:image" content="https://alikhalilll.github.io/smoking-tracker/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Smoke Tracker app icon" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smoke Tracker — taper, gap report &amp; quit plan" />
    <meta name="twitter:description" content="Track cigarettes, see gaps between every log, and follow a personalized quit plan with daily targets and reminders." />
    <meta name="twitter:image" content="https://alikhalilll.github.io/smoking-tracker/icon-512.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/smoking-tracker/favicon.svg" />
    <link rel="apple-touch-icon" href="/smoking-tracker/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Smoke Tracker",
        "url": "https://alikhalilll.github.io/smoking-tracker/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Ali Khalil",
          "url": "https://alikhalilll.github.io/",
          "sameAs": ["https://www.linkedin.com/in/alikhalilll/"]
        },
        "inLanguage": ["en", "ar"],
        "description": "A minimal PWA for tracking cigarettes, analysing gaps between every log, and following a personalized quit plan with daily targets and reminders."
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
