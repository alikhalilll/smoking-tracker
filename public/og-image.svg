<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Smoke Tracker">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer in="off" result="alpha">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Atmospheric rings, anchored on the icon -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.06">
    <circle cx="290" cy="320" r="280" stroke-width="2"/>
    <circle cx="290" cy="320" r="210" stroke-width="2"/>
    <circle cx="290" cy="320" r="140" stroke-width="2"/>
  </g>

  <!-- Top-left corner glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Icon mark on the left (translated/scaled from the 512-grid favicon) -->
  <g transform="translate(34 64) scale(0.5)" filter="url(#markShadow)">
    <!-- Stem -->
    <rect x="246" y="262" width="20" height="124" rx="10" fill="url(#mark)"/>
    <rect x="248" y="262" width="6" height="124" rx="3" fill="url(#hl)"/>
    <!-- Left leaf -->
    <path d="M256 296 C 196 286 156 246 156 178 C 156 166 164 158 176 158 C 244 158 274 222 256 296 Z" fill="url(#mark)"/>
    <path d="M186 178 C 188 196 200 218 224 240 C 220 226 218 212 218 196 C 218 184 208 176 196 176 C 192 176 188 177 186 178 Z" fill="url(#hl)"/>
    <!-- Right leaf -->
    <path d="M256 254 C 316 244 356 204 356 136 C 356 124 348 116 336 116 C 268 116 238 180 256 254 Z" fill="url(#mark)"/>
    <path d="M286 134 C 304 138 314 152 318 170 C 308 152 296 140 282 136 C 280 134 282 134 286 134 Z" fill="url(#hl)"/>
    <!-- Veins -->
    <path d="M195 200 L240 270" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
    <path d="M320 154 L266 232" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
    <!-- Spark accent -->
    <circle cx="256" cy="92" r="6" fill="#FFFFFF"/>
    <circle cx="256" cy="92" r="14" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- Right-side text block -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <!-- Eyebrow tag -->
    <g transform="translate(580 150)">
      <rect x="0" y="0" rx="22" ry="22" width="270" height="44" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="22" y="29" font-size="18" font-weight="700" letter-spacing="2" fill="#E2E8F0">QUIT-PLAN PWA</text>
    </g>

    <!-- Headline -->
    <text x="580" y="270" font-size="72" font-weight="800" letter-spacing="-2">Smoke Tracker</text>

    <!-- Subhead -->
    <text x="580" y="340" font-size="32" font-weight="600" fill="#E2E8F0" letter-spacing="-0.5">Taper, gap report &amp; quit plan.</text>

    <!-- Body line 1 -->
    <text x="580" y="408" font-size="24" font-weight="500" fill="#CBD5E1" letter-spacing="0">Track every cigarette. See the gaps.</text>
    <!-- Body line 2 -->
    <text x="580" y="442" font-size="24" font-weight="500" fill="#CBD5E1" letter-spacing="0">Follow a personalized quit plan.</text>

    <!-- Footer URL -->
    <g transform="translate(580 530)">
      <circle cx="10" cy="-7" r="5" fill="#10B981"/>
      <text x="28" y="0" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="0.5">alikhalilll.github.io/smoking-tracker</text>
    </g>
  </g>
</svg>
