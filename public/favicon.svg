<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smoke tracker">
  <defs>
    <!-- Deep, saturated tile gradient: navy -> indigo -> magenta. Reads
         as a confident product mark, not a pastel. -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Mark gradient: bright top fading to a colder slate. Gives the
         glyph metallic depth instead of looking like a sticker. -->
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Inner highlight on the leaves -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Atmospheric corner glow -->
    <radialGradient id="glow" cx="22%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the mark -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer in="off" result="alpha">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Atmospheric depth: faint orbital rings -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07">
    <circle cx="256" cy="280" r="220" stroke-width="2"/>
    <circle cx="256" cy="280" r="160" stroke-width="2"/>
    <circle cx="256" cy="280" r="100" stroke-width="2"/>
  </g>

  <!-- Top-left highlight wash -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Edge stroke for crispness on light backgrounds -->
  <rect x="2" y="2" width="508" height="508" rx="110" ry="110"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Mark: lung / leaf silhouette with drop shadow + gradient fill +
       inner highlight for depth. -->
  <g filter="url(#markShadow)">
    <!-- Stem -->
    <rect x="246" y="262" width="20" height="124" rx="10" fill="url(#mark)"/>
    <!-- Stem highlight -->
    <rect x="248" y="262" width="6" height="124" rx="3" fill="url(#highlight)"/>

    <!-- Left leaf base -->
    <path d="M256 296
             C 196 286 156 246 156 178
             C 156 166 164 158 176 158
             C 244 158 274 222 256 296 Z"
          fill="url(#mark)"/>
    <!-- Left leaf highlight -->
    <path d="M186 178
             C 188 196 200 218 224 240
             C 220 226 218 212 218 196
             C 218 184 208 176 196 176
             C 192 176 188 177 186 178 Z"
          fill="url(#highlight)"/>

    <!-- Right leaf base -->
    <path d="M256 254
             C 316 244 356 204 356 136
             C 356 124 348 116 336 116
             C 268 116 238 180 256 254 Z"
          fill="url(#mark)"/>
    <!-- Right leaf highlight -->
    <path d="M286 134
             C 304 138 314 152 318 170
             C 308 152 296 140 282 136
             C 280 134 282 134 286 134 Z"
          fill="url(#highlight)"/>

    <!-- Vein detail (left leaf) -->
    <path d="M195 200 L240 270" stroke="#FFFFFF" stroke-opacity="0.32"
          stroke-width="3" stroke-linecap="round"/>
    <!-- Vein detail (right leaf) -->
    <path d="M320 154 L266 232" stroke="#FFFFFF" stroke-opacity="0.32"
          stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tiny accent: spark above the mark for energy -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="92" r="6"/>
    <circle cx="256" cy="92" r="14" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>
</svg>
